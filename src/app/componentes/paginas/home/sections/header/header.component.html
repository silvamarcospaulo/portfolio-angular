<header id="header">
  <div id="container-header" class="soft-ui-container">
    <a id="logo" href="#">
      <span id="logo-titulo">{{ 'header.logo' | translate }}</span>
    </a>

    <nav id="main-nav">
      <app-nav-list [links]="links" orientation="horizontal" />
    </nav>

    <div class="controles-de-tela visivel">
      <div class="botoes soft-ui-container soft-ui-container-hover">
        <app-dropdown-idiomas />
      </div>
      <app-switch-dia-noite />
    </div>

    <button appIconButton shape="square" id="menu-toggle" type="button"
      (click)="toggle()" [attr.aria-label]="'header.menu.abrir' | translate">
      <i class="bi bi-list"></i>
    </button>
  </div>

  <div id="mobile-menu" [ngClass]="{ open: open() }">
    <div class="mobile-card soft-ui-container">
      <div class="mobile-head">
        <a id="brand-mobile" href="#" (click)="fecharMenu()">{{ 'header.logo' | translate }}</a>
        <button appIconButton shape="square" id="menu-close" type="button"
          (click)="fecharMenu()" [attr.aria-label]="'header.menu.fechar' | translate">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <app-nav-list [links]="links" orientation="vertical" [onNavigate]="fecharMenu.bind(this)" />
      <div class="controles-de-tela soft-ui-container">
        <div class="botoes soft-ui-container">
          <app-dropdown-idiomas />
        </div>
        <app-switch-dia-noite />
      </div>
    </div>
  </div>
</header>
