<section id="section-inicio" aria-labelledby="hero-title">
    <div class="hero-layout">
        <div class="hero-content">
            <span class="hero-eyebrow">{{ 'portfolio.hero.eyebrow' | translate }}</span>
            <h1 id="hero-title">{{ 'inicio.nome' | translate }}</h1>
            <p class="hero-role"><span aria-hidden="true">&#123;</span> {{ 'inicio.subtitulo' | translate }} <span aria-hidden="true">&#125;</span></p>
            <p class="hero-intro">{{ 'portfolio.hero.intro' | translate }}</p>
            <div class="hero-actions">
                <a class="hero-button hero-button--primary" href="#section-projetos"><i class="bi bi-grid" aria-hidden="true"></i>{{ 'portfolio.hero.projects' | translate }}</a>
                <a class="hero-button" href="#section-contato"><i class="bi bi-arrow-up-right" aria-hidden="true"></i>{{ 'portfolio.hero.contact' | translate }}</a>
            </div>
            <app-menu-redes-sociais />
        </div>
        <div class="hero-visual">
            <div class="hero-visual__surface soft-ui-container">
                <img src="/assets/images/euInicio-bw.png" width="680" height="720" fetchpriority="high" [attr.alt]="'inicio.nome' | translate">
            </div>
            <span class="hero-visual__accent" aria-hidden="true"></span>
        </div>
    </div>
</section>
