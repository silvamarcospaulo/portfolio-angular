<section id="section-projetos">
    <div id="container-carrossel">
        <div id="container-conteudo">
            <div id="container-textos">
                <app-section-header
                    title="projetos.titulo"
                    subtitle="projetos.subtitulo" />
            </div>
            <div id="container-botoes-de-acao">
                <button type="button" class="nav-btn soft-ui-container soft-ui-container-hover" (click)="anterior()" [disabled]="!hasPrev" [attr.aria-label]="'projetos.anterior' | translate">
                    <i class="bi bi-arrow-left-short seta"></i>
                </button>
                <button type="button" class="nav-btn soft-ui-container soft-ui-container-hover" (click)="proximo()" [disabled]="!hasNext" [attr.aria-label]="'projetos.proximo' | translate">
                    <i class="bi bi-arrow-right-short seta"></i>
                </button>
            </div>
        </div>

        <div id="container-card" (touchstart)="onTouchStart($event)" (touchmove)="onTouchMove($event)"
            (touchend)="onTouchEnd($event)" (touchcancel)="onTouchCancel()">
            <app-card-projetos [projeto]="projetoAtual" id="macbook"></app-card-projetos>
        </div>

        <div id="container-paginacao">
            @for (proj of listaDeProjetos; let i = $index; track proj) {
            <button class="ponto" [class.ativo]="i === projetoAtualIndex" type="button" [attr.aria-current]="i === projetoAtualIndex ? 'true' : null" (click)="projetoAtualIndex = i"
                [attr.aria-label]="'Ir para projeto ' + (i + 1)">
            </button>
            }
        </div>
    </div>
</section>
