<div class="dropdown-idiomas">
    <div class="nav-item">
        <button class="nav-link" type="button" (click)="aoClicarEmIdiomas()"
            (keydown.enter)="aoClicarEmIdiomas(); $event.preventDefault()"
            (keydown.space)="aoClicarEmIdiomas(); $event.preventDefault()" aria-haspopup="menu"
            [attr.aria-controls]="menuId" [attr.aria-expanded]="isOpen">
            <span [innerHTML]="linguagemSelecionada().icone"></span>
        </button>

        <ul class="dropdown-menu" [id]="menuId" [class.dropup]="direction === 'up'" [hidden]="!isOpen" role="menu">
            @for (lang of linguagens; track lang.id) {
            <li>
                <button type="button" role="menuitem" (click)="selecionarLinguagem(lang)">
                    <span [innerHTML]="lang.icone"></span>
                    {{ lang.nome_linguagem }}
                </button>
            </li>
            }
        </ul>
    </div>
</div>
